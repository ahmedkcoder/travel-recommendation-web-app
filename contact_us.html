<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TravelBloom</title>
    <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">TravelBloom</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about_us.html">About Us</a></li>
            <li><a href="contact_us.html">Contact Us</a></li>
        </ul>
    </nav>

    <main class="page-container">
        <h1>Contact Us</h1>
        <p>Have questions or need assistance? Get in touch with our support team!</p>
        
        <div class="contact-info">
            <p><strong>Email:</strong> support@travelbloom.com</p>
            <p><strong>Phone:</strong> +1 (555) 123-4567</p>
        </div>

        <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you for your message! We will get back to you soon.');">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Your full name">
            
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required placeholder="Your email address">
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>
            
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </main>
</body>
</html>
